name: Build LifePlan Pro macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          uname -m

      - name: Build app bundle
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Verify app
        run: |
          file "dist/LifePlan Pro.app/Contents/MacOS/LifePlanPro"
          codesign --verify --deep --strict "dist/LifePlan Pro.app"
          plutil -p "dist/LifePlan Pro.app/Contents/Info.plist"

      - name: Upload LifePlan Pro app
        uses: actions/upload-artifact@v4
        with:
          name: LifePlan-Pro-macOS
          path: dist/LifePlan-Pro-macOS.zip
          if-no-files-found: error
          retention-days: 30
